<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Adem – Onder Constructie</title>
    <meta name="description" content="Breng je zenuwstelsel tot rust met begeleide ademhalingsoefeningen. Eenvoudig, visueel en direct kalmerend.">
    <meta name="oc:groep" content="reset">
    <meta name="oc:labels" content="kalmeren">
    <meta name="oc:kort" content="Een minuut rustig ademen">
    <meta name="oc:volgorde" content="160">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E %3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;18&quot; fill=&quot;%23d1fae5&quot; stroke=&quot;%23047857&quot; stroke-width=&quot;2&quot;/%3E %3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;8&quot; stroke=&quot;%2310b981&quot; stroke-width=&quot;8&quot; fill=&quot;none&quot;/%3E %3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;4&quot; fill=&quot;%23047857&quot;/%3E %3C/svg%3E">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <style>
        :root {
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --white: #ffffff;
            --accent: #10b981;
            --accent-light: #d1fae5;
            --accent-dark: #065f46;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--slate-50);
            color: var(--slate-700);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header (patroon B) */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--slate-200);
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            position: relative;
        }

        .back-link {
            position: absolute;
            top: 1.25rem;
            left: 1.25rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            min-height: 44px;
            padding: 0 0.25rem;
            font-size: 0.875rem;
            color: var(--slate-500);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #047857;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
        }

        .logo {
            display: inline-block;
            width: 56px;
            height: 56px;
            margin-bottom: 0.5rem;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .title {
            font-size: 1.625rem;
            font-weight: 700;
            color: var(--slate-800);
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 0.9375rem;
            color: var(--slate-500);
            margin-top: 0.25rem;
        }

        :focus-visible {
            outline: 2px solid #047857;
            outline-offset: 2px;
        }

        @media (max-width: 640px) {
            .header {
                padding: 1rem 1.25rem 1.75rem;
            }

            .back-link {
                position: static;
                display: flex;
                justify-content: center;
                width: fit-content;
                margin: 0 auto 0.5rem;
            }
        }

        /* Main */
        .main {
            max-width: 600px;
            margin: 0 auto;
            padding: 3rem 2rem 4rem;
        }

        /* Card */
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 3rem 2rem;
            border: 1.5px solid var(--slate-200);
            text-align: center;
        }

        /* Breath circle container */
        .breath-container {
            position: relative;
            width: min(280px, 100%);
            aspect-ratio: 1;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breath-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--accent-light);
            transition: all 4s ease-in-out;
            box-shadow: 0 0 20px 5px rgba(16, 185, 129, 0.15),
                        0 0 40px 10px rgba(16, 185, 129, 0.05);
        }

        .breath-circle.inhale {
            width: 220px;
            height: 220px;
            background: var(--accent);
            box-shadow: 0 0 40px 15px rgba(16, 185, 129, 0.4),
                        0 0 80px 30px rgba(16, 185, 129, 0.25),
                        0 0 120px 50px rgba(16, 185, 129, 0.1);
        }

        .breath-circle.hold-in {
            width: 220px;
            height: 220px;
            background: var(--accent);
            box-shadow: 0 0 40px 15px rgba(16, 185, 129, 0.4),
                        0 0 80px 30px rgba(16, 185, 129, 0.25),
                        0 0 120px 50px rgba(16, 185, 129, 0.1);
            transition: all 0.1s;
        }

        .breath-circle.exhale {
            width: 120px;
            height: 120px;
            background: var(--accent-light);
            box-shadow: 0 0 20px 5px rgba(16, 185, 129, 0.15),
                        0 0 40px 10px rgba(16, 185, 129, 0.05);
        }

        .breath-circle.hold-out {
            width: 120px;
            height: 120px;
            background: var(--accent-light);
            box-shadow: 0 0 20px 5px rgba(16, 185, 129, 0.15),
                        0 0 40px 10px rgba(16, 185, 129, 0.05);
            transition: all 0.1s;
        }

        /* Instruction */
        .instruction {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--slate-800);
            margin-bottom: 0.5rem;
            min-height: 2.25rem;
        }

        .instruction.active {
            color: #047857;
        }

        .sub-instruction {
            font-size: 1rem;
            color: var(--slate-500);
            margin-bottom: 2rem;
            min-height: 1.5rem;
        }

        /* Pattern selector */
        .pattern-selector {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .pattern-btn {
            min-height: 44px;
            min-width: 44px;
            padding: 0.5rem 1rem;
            font-size: 0.8125rem;
            font-family: inherit;
            font-weight: 600;
            border: 1.5px solid var(--slate-200);
            border-radius: 8px;
            background: var(--white);
            color: var(--slate-500);
            cursor: pointer;
            transition: all 0.2s;
        }

        .pattern-btn:hover {
            border-color: var(--slate-300);
            color: var(--slate-700);
        }

        .pattern-btn.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: #047857;
        }

        .pattern-btn:disabled {
            cursor: default;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .btn-primary {
            background: #047857;
            color: var(--white);
        }

        .btn-primary:hover {
            background: #065f46;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: var(--slate-100);
            color: var(--slate-600);
            border: 1.5px solid var(--slate-200);
        }

        .btn-secondary:hover {
            background: var(--slate-200);
        }

        /* Cycle counter */
        .cycle-counter {
            font-size: 0.875rem;
            color: var(--slate-500);
            margin-top: 1.5rem;
        }

        .cycle-counter span {
            font-weight: 600;
            color: #047857;
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
        }

        .quote {
            font-size: 0.875rem;
            color: #047857;
        }

        /* Responsive */

        @media (max-width: 640px) {
            .main {
                padding: 2rem 1.25rem 3rem;
            }

            .card {
                padding: 2rem 1.5rem;
            }

            .breath-container {
                width: min(240px, 100%);
            }

            .breath-circle {
                width: 100px;
                height: 100px;
            }

            .breath-circle.inhale,
            .breath-circle.hold-in {
                width: 180px;
                height: 180px;
            }

            .breath-circle.exhale,
            .breath-circle.hold-out {
                width: 100px;
                height: 100px;
            }

            .pattern-selector {
                flex-wrap: wrap;
            }

            .card {
                padding: 2rem 1rem;
            }
        }
    
        /* Onder Constructie: gedeelde footer en quote (huisstijl) */
        footer.oc-footer {
            text-align: center;
            padding: 2rem 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
            margin-top: 2rem;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            color: #047857;
        }

        footer.oc-footer .oc-quote {
            font-size: 0.8125rem;
            line-height: 1.5;
            color: #047857;
            opacity: 1;
            font-style: normal;
            margin: 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="https://onderconstructie.github.io/reset/" class="back-link" aria-label="Terug naar Reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Reset
        </a>
        <div class="logo">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="20" cy="20" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
                <circle cx="20" cy="20" r="8" fill="#10b981" opacity="0.5"/>
                <circle cx="20" cy="20" r="3" fill="#047857"/>
            </svg>
        </div>
        <h1 class="title">Adem</h1>
        <p class="subtitle">Een minuut rustig ademen</p>
    </header>

    <main class="main">
        <div class="card">
            <!-- Breath circle -->
            <div class="breath-container">
                <div class="breath-circle" id="breathCircle"></div>
            </div>

            <!-- Instructions -->
            <p class="instruction" id="instruction" aria-live="polite">Klaar om te beginnen</p>
            <p class="sub-instruction" id="subInstruction">Kies een patroon en druk op start</p>

            <!-- Pattern selector -->
            <div class="pattern-selector" id="patternSelector" role="group" aria-label="Ademritme">
                <button class="pattern-btn active" data-pattern="4-4" aria-pressed="true" aria-label="4-4: 4 tellen in, 4 tellen uit">4-4</button>
                <button class="pattern-btn" data-pattern="4-7-8" aria-pressed="false" aria-label="4-7-8: 4 in, 7 vasthouden, 8 uit">4-7-8</button>
                <button class="pattern-btn" data-pattern="box" aria-pressed="false" aria-label="Vierkant: 4 in, 4 vast, 4 uit, 4 vast">Vierkant</button>
            </div>

            <!-- Controls -->
            <div id="startView">
                <button class="btn btn-primary" id="startBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Start
                </button>
            </div>

            <div id="runningView" class="hidden">
                <button class="btn btn-secondary" id="stopBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="1"/>
                    </svg>
                    Stop
                </button>
            </div>

            <!-- Cycle counter -->
            <p class="cycle-counter" id="cycleCounter" style="visibility: hidden;">
                Cyclus <span id="cycleNumber">1</span> · nog <span id="timeLeft">1:00</span>
            </p>
        </div>
    </main>

    <footer class="footer oc-footer">
        <p class="quote oc-quote">Adem is de brug tussen lichaam en geest.</p>
    </footer>

    <script>
        // Elements
        const breathCircle = document.getElementById('breathCircle');
        const instruction = document.getElementById('instruction');
        const subInstruction = document.getElementById('subInstruction');
        const patternSelector = document.getElementById('patternSelector');
        const startView = document.getElementById('startView');
        const runningView = document.getElementById('runningView');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const cycleCounter = document.getElementById('cycleCounter');
        const cycleNumber = document.getElementById('cycleNumber');

        // Patterns (in seconds)
        const patterns = {
            '4-4': { inhale: 4, holdIn: 0, exhale: 4, holdOut: 0, name: 'Basis' },
            '4-7-8': { inhale: 4, holdIn: 7, exhale: 8, holdOut: 0, name: 'Ontspanning' },
            'box': { inhale: 4, holdIn: 4, exhale: 4, holdOut: 4, name: 'Vierkant' }
        };

        // State
        let currentPattern = '4-4';
        let isRunning = false;
        let cycle = 0;
        let timeoutId = null;
        // Eén minuut: de lopende ademhaling wordt na 60 seconden rustig afgemaakt, dan stopt het vanzelf
        const SESSION = 60000;
        let startAt = 0, tick = null;
        const timeLeft = document.getElementById('timeLeft');
        function showLeft() { const s = Math.max(0, Math.ceil((SESSION - (Date.now() - startAt)) / 1000)); timeLeft.textContent = `0:${String(s).padStart(2, '0')}`; }

        // Pattern selection
        patternSelector.addEventListener('click', (e) => {
            const btn = e.target.closest('.pattern-btn');
            if (btn && !isRunning) {
                document.querySelectorAll('.pattern-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                currentPattern = btn.dataset.pattern;
            }
        });

        // Breath cycle
        function breathCycle() {
            const pattern = patterns[currentPattern];
            
            // Inhale
            breathCircle.className = 'breath-circle inhale';
            instruction.textContent = 'Adem in';
            instruction.classList.add('active');
            subInstruction.textContent = `${pattern.inhale} seconden`;
            
            timeoutId = setTimeout(() => {
                if (!isRunning) return;
                
                // Hold in (if applicable)
                if (pattern.holdIn > 0) {
                    breathCircle.className = 'breath-circle hold-in';
                    instruction.textContent = 'Vasthouden';
                    subInstruction.textContent = `${pattern.holdIn} seconden`;
                    
                    timeoutId = setTimeout(() => {
                        if (!isRunning) return;
                        exhale();
                    }, pattern.holdIn * 1000);
                } else {
                    exhale();
                }
            }, pattern.inhale * 1000);
        }

        function exhale() {
            const pattern = patterns[currentPattern];
            
            // Exhale
            breathCircle.className = 'breath-circle exhale';
            instruction.textContent = 'Adem uit';
            subInstruction.textContent = `${pattern.exhale} seconden`;
            
            timeoutId = setTimeout(() => {
                if (!isRunning) return;
                
                // Hold out (if applicable)
                if (pattern.holdOut > 0) {
                    breathCircle.className = 'breath-circle hold-out';
                    instruction.textContent = 'Vasthouden';
                    subInstruction.textContent = `${pattern.holdOut} seconden`;
                    
                    timeoutId = setTimeout(() => {
                        if (!isRunning) return;
                        completeCycle();
                    }, pattern.holdOut * 1000);
                } else {
                    completeCycle();
                }
            }, pattern.exhale * 1000);
        }

        function completeCycle() {
            cycle++;
            cycleNumber.textContent = cycle;
            
            if (!isRunning) return;
            if (Date.now() - startAt >= SESSION - 1500) { finish(); return; }
            breathCycle();
        }

        function finish() {
            stop();
            instruction.textContent = 'Klaar';
            subInstruction.textContent = `Je ademde een minuut rustig: ${cycle} ${cycle === 1 ? "ademhaling" : "ademhalingen"}. Nog een minuut? Druk op start.`;
        }

        // Start
        function start() {
            isRunning = true;
            startAt = Date.now(); showLeft(); clearInterval(tick); tick = setInterval(showLeft, 500);
            cycle = 0;
            cycleNumber.textContent = '1';
            
            startView.classList.add('hidden');
            runningView.classList.remove('hidden');
            cycleCounter.style.visibility = 'visible';
            patternSelector.style.opacity = '0.5';
            patternSelector.style.pointerEvents = 'none';
            patternSelector.querySelectorAll('button').forEach(b => b.disabled = true);
            stopBtn.focus();
            
            breathCycle();
        }

        // Stop
        function stop() {
            isRunning = false;
            clearTimeout(timeoutId); clearInterval(tick);
            
            breathCircle.className = 'breath-circle';
            instruction.textContent = 'Klaar om te beginnen';
            instruction.classList.remove('active');
            subInstruction.textContent = 'Kies een patroon en druk op start';
            
            runningView.classList.add('hidden');
            startView.classList.remove('hidden');
            cycleCounter.style.visibility = 'hidden';
            patternSelector.style.opacity = '1';
            patternSelector.style.pointerEvents = 'auto';
            patternSelector.querySelectorAll('button').forEach(b => b.disabled = false);
            startBtn.focus();
        }

        // Event listeners
        startBtn.addEventListener('click', start);
        stopBtn.addEventListener('click', stop);

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (e.target.closest && e.target.closest('button, a')) return;
                e.preventDefault();
                if (isRunning) {
                    stop();
                } else {
                    start();
                }
            }
        });
    </script>
</body>
</html>
